<!doctype html><html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="TikGrow">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg"><link rel="stylesheet" href="style.css">
<title>TikGrow</title></head><body>
<header><strong>TikGrow</strong><button id="theme">☾</button></header>
<main>
<div class="hero"><small>TAKİPÇİ HEDEFİN</small><h1><span id="followers">0</span> / <span id="goal">1000</span></h1><div class="bar"><i id="progress"></i></div><p id="percent">0% tamamlandı</p></div>
<div class="stats"><div><b id="points">0</b><small>Puan</small></div><div><b id="tasks">0</b><small>Görev</small></div><div><b id="streak">0</b><small>Seri</small></div></div>
<h2>🔥 Bugünün görevleri</h2><div id="taskList"></div>
<div class="card"><h2>🎯 Takipçi hedefi</h2><div class="row"><input id="goalInput" type="number" placeholder="Hedef"><button id="saveGoal">Kaydet</button></div></div>
<div class="card"><h2>📈 Günlük hedef hesapla</h2><div class="grid"><input id="current" type="number" placeholder="Mevcut"><input id="target" type="number" placeholder="Hedef"><input id="days" type="number" placeholder="Gün"></div><button id="calc">Hesapla</button><p id="result"></p></div>
<div class="install"><b>📲 iPhone'a ekle</b><p>Safari'de bu sayfayı aç → <b>Paylaş</b> → <b>Ana Ekrana Ekle</b> → Ekle.</p></div>
</main><nav><button>⌂<span>Ana Sayfa</span></button><button>✓<span>Görevler</span></button><button>◉<span>Profil</span></button></nav>
<script src="app.js"></script></body></html>
